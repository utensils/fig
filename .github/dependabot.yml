# dependabot.yml
# Automated dependency updates configuration

version: 2
updates:
  # Cargo (Rust)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps):"
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "doomspork"
